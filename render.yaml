services:
  - type: web
    name: friendspace-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: friendspace-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FORCE_DEFAULT_ADMIN
        value: "true"

databases:
  - name: friendspace-db
    plan: free
    region: frankfurt
    databaseName: friendspace
    user: friendspace
